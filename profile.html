<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="profile.css">
</head>
<div class="card">

  <div class="img">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCZAwlJKR5bgqJW1ej1O9kGg5Wrq2OtsQCQzKNiENdqw&s=10"
      alt="Student Profile">
    <div class="name">
      <label for="name">Name:</label>
      <input type="text" placeholder="Enter Your Name">
    </div>

    <div class="bio">
      <label for="bio">Bio:</label>
      <input type="text" placeholder="Write Your Bio">
    </div>

    <div class="links">
      <label for="links">Social Links:</label>
      <input type="url" placeholder="Attach Your Social Links">

      <div class="skill">
        <p>Skills:</p>
        <span>
          <input type="checkbox" id="skills" name="skills" value="HTML">
          <label for="skills">HTML</label>
        </span>
        <span>

          <input type="checkbox" id="css" name="skills" value="CSS">
          <label for="css">CSS</label>
        </span>
        <span>
          <input type="checkbox" id="js" name="skills" value="JavaScript">
          <label for="js">JavaScript</label>
        </span>
        <span>

          <input type="checkbox" id="node" name="skills" value="Node.js">
          <label for="node">Node.js</label>
        </span>
        <span>

          <input type="checkbox" id="react" name="skills" value="React">
          <label for="react">React</label>
        </span>
        <span>

          <input type="checkbox" id="DB" name="skills" value="Database">
          <label for="DB">Database</label>
        </span>
      </div>

    </div>
  </div>
  </body>

</html>
